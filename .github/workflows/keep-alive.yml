# Giữ Supabase free tier không tự pause: ping nhẹ Auth health mỗi 2 ngày.
# Endpoint này chỉ cần anon key hợp lệ, không đòi quyền trên bảng nào
# nên KHÔNG cần nới lỏng RLS. URL/key lấy từ secrets, không hardcode.
name: Supabase keep-alive

on:
  schedule:
    # 03:00 UTC, cứ 2 ngày một lần.
    - cron: '0 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase Auth health http=$code"
          [ "$code" = "200" ]
